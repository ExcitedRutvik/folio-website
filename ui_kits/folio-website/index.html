<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio · UI Kit — click-thru recreation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,30..100;1,9..144,300..800,30..100&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
<style>
  /* Bring back the homepage-specific patches from the source index.html
     (the marketing site put these in a per-page <style> block). */
  .hero { padding: clamp(32px, 4vw, 56px) 0 clamp(24px, 3vw, 40px); position: relative; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(40px, 5vw, 80px); align-items: center; }
  .hero-headline { font-family: var(--serif); font-size: clamp(44px, 6.5vw, 88px); font-weight: 300; line-height: 1.02; letter-spacing: -0.035em; font-variation-settings: 'SOFT' 30, 'opsz' 144; margin-bottom: 24px; }
  .hero-headline .city-rotator { font-size: 1em; font-weight: 300; }
  .hero-sub { font-size: 16px; color: var(--fg-mute); line-height: 1.6; max-width: 460px; margin-bottom: 28px; }
  .hero-actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .trust-strip { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .trust-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--fg-dim); }
  .trust-items { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .trust-item { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--fg-mute); font-variation-settings: 'SOFT' 100, 'opsz' 144; }
  .trust-item-num { font-family: var(--mono); font-style: normal; color: var(--accent); font-size: 13px; margin-right: 6px; vertical-align: 1px; }

  .sect-head { margin-bottom: clamp(28px, 4vw, 48px); max-width: 760px; }
  .sect-head h2 { font-size: clamp(34px, 4.5vw, 64px); }
  .sect-head p { font-size: 17px; color: var(--fg-mute); line-height: 1.65; margin-top: 20px; max-width: 580px; }

  .what-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
  .what-item { background: var(--bg); padding: 48px 40px; display: flex; flex-direction: column; gap: 16px; transition: background 0.25s; cursor: pointer; }
  .what-item:hover { background: var(--bg-2); }
  .what-num { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; color: var(--accent); }
  .what-title { font-family: var(--serif); font-size: 28px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; font-variation-settings: 'SOFT' 30, 'opsz' 144; }
  .what-desc { font-size: 14px; color: var(--fg-mute); line-height: 1.65; }
  .what-link { font-family: var(--sans); font-size: 13px; color: var(--fg); margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; transition: color 0.2s; }
  .what-link::after { content: '→'; transition: transform 0.25s var(--ease); }
  .what-item:hover .what-link { color: var(--accent); }
  .what-item:hover .what-link::after { transform: translateX(4px); }

  .process-rail { position: relative; padding-left: 32px; }
  .process-rail::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: linear-gradient(180deg, var(--accent) 0%, var(--border) 100%); }
  .process-step { display: grid; grid-template-columns: 0.4fr 1.6fr; gap: 48px; padding: 36px 0; border-top: 1px solid var(--border); position: relative; }
  .process-step:first-child { border-top: none; padding-top: 0; }
  .process-step::before { content: ''; position: absolute; left: -36px; top: 38px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--bg), 0 0 12px var(--accent); }
  .process-step:first-child::before { top: 4px; }
  .process-num { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; color: var(--fg-dim); padding-top: 8px; }
  .process-title { font-family: var(--serif); font-size: 32px; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 12px; font-variation-settings: 'SOFT' 30, 'opsz' 144; }
  .process-body { font-size: 15px; color: var(--fg-mute); line-height: 1.7; max-width: 540px; }

  .cta-section { position: relative; padding: clamp(48px, 7vw, 100px) 0; text-align: center; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); overflow: hidden; }
  .cta-section::before { content: ''; position: absolute; top: 50%; left: 50%; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(57,211,83,0.06) 0%, transparent 65%); transform: translate(-50%, -50%); pointer-events: none; }
  .cta-headline { font-family: var(--serif); font-size: clamp(48px, 7vw, 96px); font-weight: 300; line-height: 1.05; letter-spacing: -0.035em; margin-bottom: 28px; position: relative; max-width: 880px; margin-left: auto; margin-right: auto; font-variation-settings: 'SOFT' 30, 'opsz' 144; }
  .cta-sub { font-size: 17px; color: var(--fg-mute); max-width: 520px; margin: 0 auto 44px; line-height: 1.65; position: relative; }
  .cta-section .hero-actions { justify-content: center; position: relative; }

  .techstax-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
  .tech-group { background: var(--bg); padding: 28px 32px; display: flex; flex-direction: column; gap: 14px; transition: background 0.2s; }
  .tech-group:hover { background: var(--bg-2); }
  .tech-group-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--fg-dim); }
  .tech-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .tech-pill { font-family: var(--mono); font-size: 12px; letter-spacing: 0.3px; color: var(--fg-mute); background: var(--bg-3); border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; }
  .tech-pill.accent { color: var(--accent); border-color: rgba(57,211,83,0.25); background: var(--accent-dim); }

  .faq-home-grid { display: grid; grid-template-columns: 0.6fr 1.4fr; gap: clamp(40px, 6vw, 96px); align-items: start; }
  .faq-home-side { position: sticky; top: 120px; }
  .faq-home-side h2 { font-size: clamp(36px, 4.5vw, 60px); letter-spacing: -0.03em; line-height: 1.05; margin-bottom: 20px; }
  .faq-home-side p { font-size: 15px; color: var(--fg-mute); line-height: 1.65; margin-bottom: 28px; }
  .faq-home-list { display: flex; flex-direction: column; }
  .faq-home-item { border-top: 1px solid var(--border); padding: 0; }
  .faq-home-item:last-child { border-bottom: 1px solid var(--border); }
  .faq-home-item summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 20px 0; }
  .faq-home-item summary::-webkit-details-marker { display: none; }
  .faq-home-q { font-family: var(--serif); font-size: 18px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.3; font-variation-settings: 'SOFT' 30, 'opsz' 144; }
  .faq-home-toggle { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-mid); display: inline-flex; align-items: center; justify-content: center; color: var(--fg-mute); font-size: 18px; transition: all 0.25s var(--ease); flex-shrink: 0; }
  .faq-home-item[open] .faq-home-toggle { background: var(--accent); color: var(--bg); border-color: var(--accent); transform: rotate(45deg); }
  .faq-home-a { padding: 0 0 20px; font-size: 14px; color: var(--fg-mute); line-height: 1.7; max-width: 600px; }

  /* Page hero (used by Services, About, Contact, Blog) */
  .page-hero { padding: clamp(36px, 5vw, 64px) 0 clamp(24px, 3vw, 40px); }

  /* Inputs */
  input[type="text"], input[type="email"], input[type="url"], textarea {
    font-family: var(--sans);
    font-size: 15px;
    color: var(--fg);
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
    width: 100%;
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="url"]:focus, textarea:focus {
    border-color: var(--accent-mid);
    background: var(--bg);
  }
  input::placeholder { color: var(--fg-dim); }

  /* ═══════════════════════════════════════════════════════════
     PORTFOLIO PROJECTOR  ·  hero right column
     Glass screen fills the right column's height — top aligns
     with the eyebrow, bottom aligns with the stats strip. Inside:
     a Netflix-style poster grid of every project we've shipped.
     Click a card → that project's snippet plays inline.
  ═══════════════════════════════════════════════════════════ */
  .hp {
    position: relative;
    width: 100%;
    min-height: 560px;
    height: 100%;
    isolation: isolate;
  }
  .hp-atmos {
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(50% 60% at 50% 50%, rgba(57,211,83,0.10) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    filter: blur(2px);
  }

  .hp-screen {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    min-height: 560px;
    border-radius: 28px;
    background:
      linear-gradient(180deg, rgba(57,211,83,0.06) 0%, rgba(57,211,83,0.02) 60%, rgba(57,211,83,0.05) 100%),
      rgba(10,10,11,0.32);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow:
      inset 0 0 1px rgba(244,241,232,0.08),
      inset 0 0 80px rgba(57,211,83,0.10),
      0 0 70px rgba(57,211,83,0.15);
    overflow: hidden;
  }
  .hp-screen-body {
    position: absolute;
    inset: 20px;
    display: flex;
    flex-direction: column;
    animation: hp-body-in 0.6s var(--ease);
  }
  @keyframes hp-body-in {
    from { opacity: 0; transform: translateY(8px) scale(0.99); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    filter: blur(0); }
  }

  /* ── NETFLIX-STYLE POSTER GRID ── */
  .hp-grid-wrap {
    overflow: hidden;
  }
  .hp-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    height: 100%;
    overflow-y: auto;
    padding-right: 6px;
    -webkit-mask: linear-gradient(180deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
            mask: linear-gradient(180deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
    scrollbar-width: thin;
    scrollbar-color: rgba(57,211,83,0.35) transparent;
  }
  .hp-grid::-webkit-scrollbar { width: 4px; }
  .hp-grid::-webkit-scrollbar-thumb { background: rgba(57,211,83,0.35); border-radius: 999px; }

  .hp-card {
    position: relative;
    aspect-ratio: 16 / 11;
    border: none;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    padding: 0;
    background: var(--bg-3);
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    font: inherit;
    text-align: left;
    color: var(--fg);
  }
  .hp-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 36px rgba(0,0,0,0.5), 0 0 0 1px rgba(57,211,83,0.45), 0 0 24px rgba(57,211,83,0.25);
    z-index: 2;
  }
  .hp-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .hp-card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,11,0) 30%, rgba(10,10,11,0.85) 100%);
    pointer-events: none;
  }
  .hp-card-mark {
    position: absolute;
    top: 7px; left: 9px;
    font-family: var(--serif);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: -0.04em;
    color: var(--accent);
    background: rgba(10,10,11,0.55);
    backdrop-filter: blur(6px);
    padding: 2px 7px;
    border-radius: 4px;
    line-height: 1;
    font-variation-settings: 'SOFT' 100, 'opsz' 144;
  }
  .hp-card-meta {
    position: absolute;
    bottom: 8px; left: 10px; right: 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 1;
  }
  .hp-card-industry {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .hp-card-title {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.015em;
    color: var(--fg);
    font-variation-settings: 'SOFT' 30, 'opsz' 144;
  }

  /* ── POSTER BACKGROUNDS ── */
  .hp-poster-deepak  { background: radial-gradient(120% 80% at 30% 30%, #6b4a1a 0%, #2a1b06 60%, #0e0a02 100%); }
  .hp-poster-arch    { background: linear-gradient(135deg, #2a3a30 0%, #0e1813 100%); }
  .hp-poster-fid     { background: linear-gradient(160deg, #1a2330 0%, #08101a 100%); }
  .hp-poster-rest    { background: radial-gradient(120% 80% at 70% 60%, #532a1c 0%, #1a0a06 70%, #0a0403 100%); }
  .hp-poster-saas    { background: linear-gradient(135deg, #16332b 0%, #051410 100%); }
  .hp-poster-gallery { background: linear-gradient(135deg, #232328 0%, #0a0a0b 100%); }
  .hp-poster-clinic  { background: linear-gradient(135deg, #182a2c 0%, #06141a 100%); }
  .hp-poster-realty  { background: linear-gradient(135deg, #2c2418 0%, #14100a 100%); }
  .hp-poster-school  { background: linear-gradient(135deg, #2a1b30 0%, #0b061a 100%); }
  .hp-poster-oil     { background: radial-gradient(120% 80% at 50% 50%, #3a2c10 0%, #1a1306 70%, #0a0703 100%); }
  .hp-poster-law     { background: linear-gradient(135deg, #1a1d24 0%, #08090c 100%); }
  .hp-poster-bakery  { background: radial-gradient(120% 80% at 30% 60%, #4a2c14 0%, #1a0e06 70%, #0a0603 100%); }
  .hp-poster-photo   { background: linear-gradient(135deg, #1a1a1e 0%, #050506 100%); }
  .hp-poster-wine    { background: radial-gradient(120% 80% at 50% 50%, #3a1018 0%, #1a060a 70%, #0a0203 100%); }
  .hp-poster-agency  { background: linear-gradient(135deg, #18222a 0%, #060a10 100%); }
  .hp-poster-devtool { background: linear-gradient(135deg, #16332b 0%, #07120e 100%); }
  .hp-poster-museum  { background: linear-gradient(135deg, #2a2230 0%, #0a070e 100%); }
  .hp-poster-fitness { background: linear-gradient(135deg, #2c3010 0%, #0e1004 100%); }
  .hp-poster-rec     { background: linear-gradient(135deg, #301a2a 0%, #0e0613 100%); }
  .hp-poster-studio  { background: linear-gradient(135deg, #1a2a2c 0%, #060f10 100%); }

  /* Subtle pattern overlay common to all posters */
  .hp-card::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent 0 16px, rgba(244,241,232,0.04) 16px 17px);
    pointer-events: none;
  }

  /* ── OPENED SNIPPET VIEW ── */
  .hp-snippet-wrap {
    gap: 12px;
  }
  .hp-back {
    align-self: flex-start;
    background: rgba(10,10,11,0.55);
    border: 1px solid rgba(244,241,232,0.10);
    color: var(--fg);
    padding: 6px 14px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s var(--ease);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .hp-back:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 16px rgba(57,211,83,0.25);
  }
  .hp-back-arrow { font-size: 14px; }
  .hp-snippet-stage {
    flex: 1;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(10,10,11,0.30);
    border: 1px solid rgba(57,211,83,0.18);
    padding: 14px 16px;
    display: flex;
  }
  .hp-snippet-url {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
  }
  .hp-snippet-url span { color: var(--fg-dim); }

  /* Snippet inner anatomy */
  .snip {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-family: var(--sans);
    color: var(--fg);
    background: transparent;
  }
  .snip-nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid rgba(244,241,232,0.08); }
  .snip-logo { font-family: var(--serif); font-size: 15px; font-weight: 500; letter-spacing: -0.02em; color: var(--fg); font-variation-settings: 'SOFT' 30, 'opsz' 144; }
  .snip-logo em { font-style: italic; color: var(--accent); font-variation-settings: 'SOFT' 100, 'opsz' 144; }
  .snip-navlinks { display: flex; gap: 12px; font-family: var(--mono); font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--fg-dim); }
  .snip-hero { display: flex; flex-direction: column; gap: 6px; }
  .snip-eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); }
  .snip-hero h4 { font-family: var(--serif); font-size: 28px; line-height: 1.05; letter-spacing: -0.025em; font-weight: 300; color: var(--fg); font-variation-settings: 'SOFT' 30, 'opsz' 144; margin: 2px 0 0; }
  .snip-hero h4 em { font-style: italic; color: var(--accent); font-variation-settings: 'SOFT' 100, 'opsz' 144; }
  .snip-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .snip-cta { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--bg); background: var(--accent); padding: 6px 12px; border-radius: 999px; }
  .snip-meta { font-family: var(--mono); font-size: 10px; color: var(--fg-mute); }
  .snip-grid-3 { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .snip-tile { background: rgba(244,241,232,0.04); border: 1px solid rgba(244,241,232,0.06); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
  .snip-tile .t-price { font-family: var(--mono); font-size: 10px; color: var(--accent); }
  .snip-photos { margin-top: auto; display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: 80px; gap: 8px; }
  .snip-photo { border-radius: 8px; border: 1px solid rgba(244,241,232,0.06); }
  .snip-photo.p1 { background: linear-gradient(135deg, #2a3a30, #0e1813); }
  .snip-photo.p2 { background: linear-gradient(160deg, #3a3024, #16100a); }
  .snip-photo.p3 { background: linear-gradient(135deg, #1c2330, #0b0f15); }
  .snip-stats { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-top: 10px; border-top: 1px solid rgba(244,241,232,0.08); }
  .snip-stats .s-v { display: block; font-family: var(--serif); font-size: 22px; font-style: italic; color: var(--accent); font-variation-settings: 'SOFT' 100, 'opsz' 144; line-height: 1; }
  .snip-stats .s-l { font-family: var(--mono); font-size: 10px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 1px; }
  .snip-menu { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  .snip-menu .m-row { display: flex; justify-content: space-between; padding: 7px 10px; background: rgba(244,241,232,0.03); border-radius: 6px; font-size: 12px; }
  .snip-menu .m-row span:last-child { font-family: var(--mono); color: var(--accent); }
  .snip-chart { margin-top: auto; height: 80px; width: 100%; }
  .snip-chart svg { width: 100%; height: 100%; }

  /* ── Folio watermark — bottom-right of the glass screen ── */
  .hp-watermark {
    position: absolute;
    bottom: 12px; right: 16px;
    z-index: 6;
    pointer-events: none;
  }
  .hp-watermark-mark {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.03em;
    color: var(--fg);
    font-variation-settings: 'SOFT' 30, 'opsz' 144;
    opacity: 0.8;
  }
  .hp-watermark-mark i {
    font-style: italic;
    color: var(--accent);
    font-variation-settings: 'SOFT' 100, 'opsz' 144;
  }

  /* Make the hero grid stretch so the screen fills its column */
  .hero-grid { align-items: stretch; }
  .hero-right { display: flex; }

  @media (max-width: 720px) {
    .hp-grid { grid-template-columns: repeat(2, 1fr); }
  }
  /* ── NAV — enlarged logo, aligned baseline across all pages ── */
  .nav-inner { height: 84px; gap: 24px; }
  .nav-logo { font-size: 34px; letter-spacing: -0.045em; line-height: 1; }
  .nav-links a { font-size: 14px; }
  .nav-right { gap: 22px; }

  /* Brand signature: every <Italic> renders in electric green. */
  .italic, em.italic { color: var(--accent); }

  /* Compare table touch-up */
  .compare-cell { display: flex; align-items: center; gap: 10px; }
  .compare-yes { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); font-size: 12px; flex-shrink: 0; }
  .compare-no { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(244,241,232,0.04); color: var(--fg-dim); font-size: 12px; flex-shrink: 0; }

  /* ═══════════════════════════════════════════════════════════
     CITY ROTATOR — width-stable, never reflows the headline.
  ═══════════════════════════════════════════════════════════ */
  .city-rotator {
    display: inline-grid;
    vertical-align: baseline;
    position: relative;
    color: var(--accent);
    font-style: italic;
    font-variation-settings: 'SOFT' 100, 'opsz' 144;
    min-width: 0;
  }
  .city-rotator > * { grid-area: 1 / 1; }
  .city-spacer { visibility: hidden; pointer-events: none; user-select: none; }
  .city-active {
    animation: city-cycle 0.6s var(--ease);
    will-change: opacity, transform, filter;
  }
  .city-rotator::after { content: none; }
  @keyframes city-cycle {
    0%   { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* ═══════════════════════════════════════════════════════════
     HOLOGRAPHIC GLOBE  ·  Technologies page hero visual
  ═══════════════════════════════════════════════════════════ */
  .holo-globe {
    position: relative;
    aspect-ratio: 1 / 1;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    isolation: isolate;
  }
  .holo-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 0 32px rgba(57,211,83,0.18));
  }
  .holo-meridians {
    transform-origin: 50% 50%;
    animation: holo-spin 28s linear infinite;
  }
  @keyframes holo-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .holo-noise {
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(57,211,83,0.03) 2px, rgba(57,211,83,0.03) 3px),
      radial-gradient(circle at 50% 50%, rgba(57,211,83,0.10) 0%, transparent 60%);
    mix-blend-mode: screen;
    pointer-events: none;
  }
  /* Floating tech tags around the globe */
  .holo-tags {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .holo-tag {
    position: absolute;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.4px;
    color: var(--fg);
    background: rgba(10,10,11,0.7);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(57,211,83,0.35);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
    box-shadow: 0 0 16px rgba(57,211,83,0.18);
  }
  .holo-tag::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: 1px;
    box-shadow: 0 0 6px var(--accent);
  }
  .holo-tag-0 { top: 6%;  left: 12%; animation: holo-float 6s ease-in-out infinite; }
  .holo-tag-1 { top: 22%; right: 4%; animation: holo-float 7s ease-in-out infinite reverse; }
  .holo-tag-2 { bottom: 18%; left: 4%; animation: holo-float 8s ease-in-out infinite; }
  .holo-tag-3 { bottom: 6%; right: 14%; animation: holo-float 9s ease-in-out infinite reverse; }
  @keyframes holo-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  .holo-readout {
    position: absolute;
    bottom: -8px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 18px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
  .holo-readout-row { display: flex; align-items: center; gap: 8px; }
  .holo-readout .holo-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: holo-pulse 1.6s ease-in-out infinite;
  }
  @keyframes holo-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.7); }
  }

  /* ═══════════════════════════════════════════════════════════
     TECHNOLOGIES PAGE
  ═══════════════════════════════════════════════════════════ */
  .tech-hero { position: relative; overflow: hidden; padding-bottom: clamp(48px, 6vw, 80px); }
  .tech-hero-glow {
    position: absolute;
    top: -120px; right: -160px;
    width: 720px; height: 720px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(57,211,83,0.08) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }
  .tech-hero-grid {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: clamp(40px, 5vw, 80px);
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .tech-meta {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
  }
  .tech-meta > div { display: flex; flex-direction: column; gap: 4px; }
  .tech-meta-num {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.03em;
    color: var(--accent);
    font-style: italic;
    font-variation-settings: 'SOFT' 100, 'opsz' 144;
    line-height: 1;
  }
  .tech-meta > div > span:last-child {
    font-size: 12px;
    color: var(--fg-mute);
    max-width: 160px;
    line-height: 1.5;
  }
  .tech-hero-globe { display: flex; align-items: center; justify-content: center; }

  .tech-block {
    padding: clamp(48px, 6vw, 80px) 0;
    border-top: 1px solid var(--border);
    position: relative;
  }
  .tech-block-alt { background: var(--bg-2); }
  .tech-groups {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .tech-group-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 24px 26px 14px;
    transition: border-color 0.3s var(--ease), transform 0.3s var(--ease);
  }
  .tech-block-alt .tech-group-card { background: var(--bg); }
  .tech-group-card:hover {
    border-color: var(--border-mid);
  }
  .tech-group-card .tech-group-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    background: none;
    padding: 0;
  }
  .tech-items { list-style: none; padding: 0; margin: 0; }
  .tech-item {
    display: grid;
    grid-template-columns: 1fr;
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }
  .tech-item:first-child { border-top: none; padding-top: 0; }
  .tech-item-name {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 400;
    letter-spacing: -0.015em;
    color: var(--fg);
    margin-bottom: 4px;
    font-variation-settings: 'SOFT' 30, 'opsz' 144;
  }
  .tech-item-accent .tech-item-name {
    color: var(--accent);
    font-style: italic;
    font-variation-settings: 'SOFT' 100, 'opsz' 144;
  }
  .tech-item-body { font-size: 13px; color: var(--fg-mute); line-height: 1.55; }

  .tech-not-do {
    padding: clamp(48px, 6vw, 80px) 0;
    border-top: 1px solid var(--border);
  }
  .not-do-grid {
    display: grid;
    grid-template-columns: 0.7fr 1.3fr;
    gap: clamp(40px, 6vw, 96px);
    align-items: start;
  }
  .not-do-list { list-style: none; padding: 0; margin: 0; }
  .not-do-list li {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 18px;
    padding: 18px 0;
    border-top: 1px solid var(--border);
    align-items: start;
  }
  .not-do-list li:first-child { border-top: none; padding-top: 0; }
  .not-do-list strong { font-family: var(--serif); font-weight: 400; font-size: 18px; color: var(--fg); display: block; margin-bottom: 4px; font-variation-settings: 'SOFT' 30, 'opsz' 144; }
  .not-do-list li > div { font-size: 14px; color: var(--fg-mute); line-height: 1.65; }
  .not-do-x {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(239,68,68,0.10);
    color: rgba(239,68,68,0.85);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
  }

  /* ═══════════════════════════════════════════════════════════
     INDUSTRIES PAGE
  ═══════════════════════════════════════════════════════════ */
  .industries-hero { padding-bottom: clamp(48px, 6vw, 80px); }
  .industries-section { padding: clamp(48px, 6vw, 80px) 0; border-top: 1px solid var(--border); }
  .industries-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
  }
  .industry-card {
    background: var(--bg);
    padding: 36px 36px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: background 0.25s var(--ease);
  }
  .industry-card:hover { background: var(--bg-2); }
  .industry-head { display: flex; align-items: center; gap: 14px; }
  .industry-num {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--accent);
  }
  .industry-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
  .industry-title {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 4px 0 0;
    font-variation-settings: 'SOFT' 30, 'opsz' 144;
  }
  .industry-copy { font-size: 14px; color: var(--fg-mute); line-height: 1.7; max-width: 540px; }
  .industry-examples {
    list-style: none;
    padding: 0;
    margin: 4px 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .industry-examples li {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.3px;
    color: var(--fg-mute);
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
  }
  .industry-card:hover .industry-examples li { border-color: var(--border-mid); }
  .industry-stat {
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .industry-stat-v {
    font-family: var(--serif);
    font-size: 22px;
    font-style: italic;
    color: var(--accent);
    font-variation-settings: 'SOFT' 100, 'opsz' 144;
    line-height: 1;
  }
  .industry-stat-l { font-size: 12px; color: var(--fg-dim); }

  .industries-tail {
    padding: clamp(48px, 6vw, 80px) 0;
    border-top: 1px solid var(--border);
  }
  .industries-tail-inner { text-align: left; }

  /* ═══════════════════════════════════════════════════════════
     RESPONSIVE
  ═══════════════════════════════════════════════════════════ */
  @media (max-width: 1100px) {
    .nav-links a { padding: 8px 10px; font-size: 13px; }
  }
  @media (max-width: 960px) {
    .tech-hero-grid { grid-template-columns: 1fr; }
    .tech-groups { grid-template-columns: 1fr; }
    .industries-grid { grid-template-columns: 1fr; }
    .not-do-grid { grid-template-columns: 1fr; gap: 32px; }
  }
  @media (max-width: 720px) {
    .nav-links { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="holo_hero.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>
<script type="text/babel" src="tech_industries.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
